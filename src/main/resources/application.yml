server:
  # 服务启动端口，默认是8080，为了避免冲突可以改一下
  port: 8081
  tomcat:
    threads:
      max: 800         # 最大工作线程数（默认200，高并发场景需加大）
      min-spare: 100   # 最小空闲线程数（默认10）
    max-connections: 10000  # 最大连接数（默认8192）
    accept-count: 1000      # 等待队列长度（默认100）

spring:
  application:
    name: nexusmart-seckill
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        service: ${NACOS_SERVICE_NAME:${spring.application.name}}
      config:
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
        refresh-enabled: true
    sentinel:
      # Sentinel 控制台地址（可选，本地不部署 dashboard 时留空）
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
        port: ${SENTINEL_TRANSPORT_PORT:8719}
      # 关键开关：饿加载，启动即注册所有资源，避免第一次访问才埋点
      eager: true
      # 让 Sentinel 也介入 RestTemplate / WebClient 等出向调用（按需打开）
      filter:
        enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:nexusmart-seckill-order-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: latest
      enable-auto-commit: false
    listener:
      ack-mode: record
  datasource:
    # MySQL 8.0 及以上的标准驱动类名
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地开发常用参数：关闭 SSL + 允许公钥检索，避免 MySQL8 默认认证导致连接失败
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/nexusmart?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 100     # 最大连接数（默认10，远不够高并发）
      minimum-idle: 20           # 最小空闲连接数
      connection-timeout: 10000  # 获取连接超时（毫秒），默认30000
      idle-timeout: 300000       # 空闲连接最大存活时间
      max-lifetime: 600000       # 连接最大生命周期

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # 无密码则留空
      database: 0
      lettuce:
        pool:
          max-active: 200   # 最大活跃连接数（默认8）
          max-idle: 50      # 最大空闲连接数
          min-idle: 10      # 最小空闲连接数
          max-wait: 5000ms  # 获取连接最大等待时间
    elasticsearch:
      uris: ${ES_URIS:http://127.0.0.1:9200}
      connection-timeout: 3s
      socket-timeout: 30s

# MyBatis 配置
mybatis:
  # 如果后续写 XML Mapper 文件，放在 resources/mapper/ 目录下即可自动扫描
  mapper-locations: classpath:mapper/*.xml
  configuration:
    # 开启驼峰命名自动映射：数据库 goods_name -> Java goodsName
    map-underscore-to-camel-case: true
    # 打印 SQL 日志，方便开发调试（上线时改为 WARN 或去掉）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  id:
    # 雪花 ID 节点配置：单机可保持默认，多实例部署时需确保不同节点不重复
    worker-id: ${ID_WORKER:1}
    datacenter-id: ${ID_DATACENTER:1}
  kafka:
    producer:
      send-timeout-ms: 3000
    topic:
      partitions: 3
      replicas: 1
    topics:
      order-create: ${KAFKA_TOPIC_ORDER_CREATE:seckill.order.create.v1}
      order-create-dlt: ${KAFKA_TOPIC_ORDER_CREATE_DLT:seckill.order.create.v1.DLT}
      payment-result: ${KAFKA_TOPIC_PAYMENT_RESULT:seckill.payment.result.v1}
      payment-result-dlt: ${KAFKA_TOPIC_PAYMENT_RESULT_DLT:seckill.payment.result.v1.DLT}
    consumer:
      retry:
        max-attempts: 3
        backoff-ms: 1000
  cache:
    # 空对象 TTL（秒）— 防穿透：DB 查不到时缓存空值的存活时间
    empty-ttl-seconds: 300
    # 互斥锁 TTL（秒）— 防击穿：缓存重建锁的自动过期
    lock-ttl-seconds: 10
    local:
      # Caffeine L1 缓存最大条目数
      maximum-size: 10000
      # Caffeine 写入后过期时间（秒）— 故意远小于 Redis TTL，避免本地长期陈旧
      expire-seconds: 60
  bloom:
    # 预期容量（用于布隆过滤器位数组大小估算）
    expected-insertions: 100000
    # 期望误判率
    fpp: 0.01
  sentinel:
    # 流控规则（每个资源的 QPS 阈值）
    flow:
      product-detail-qps: 100
      product-search-qps: 50
    # 熔断规则（异常比例 + 熔断窗口）
    degrade:
      product-search-error-ratio: 0.5
      product-search-window-seconds: 10
  seckill:
    pending-ttl-seconds: 600
    result-ttl-seconds: 86400
    idempotent-ttl-seconds: 604800
    message:
      # 保障下单+库存在跨服务消息中的重试窗口
      reserve-timeout-ms: 15000
    compensation:
      timeout-ms: 120000
      scan-interval-ms: 10000
      batch-size: 200
  datasource:
    master:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${DB_MASTER_HOST:127.0.0.1}:${DB_MASTER_PORT:3307}/nexusmart?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:123456}
      maximum-pool-size: 60
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
    slave:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${DB_SLAVE_HOST:127.0.0.1}:${DB_SLAVE_PORT:3308}/nexusmart?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      username: ${DB_USER:root}
      password: ${DB_PASSWORD:123456}
      maximum-pool-size: 60
      minimum-idle: 10
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000

nexusmart:
  dynamic:
    message: ${NEXUSMART_DYNAMIC_MESSAGE:hello-from-local-config}
  pressure:
    # 模拟接口响应延迟（毫秒）
    simulate-latency-ms: ${NEXUSMART_PRESSURE_LATENCY_MS:0}
    # 模拟接口失败概率：0~1 的比例（0.3 = 30%）。会被夹紧到 [0,1]
    failure-rate: ${NEXUSMART_PRESSURE_FAILURE_RATE:0}

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always