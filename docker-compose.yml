services:
  # ==================== MySQL Master ====================
  mysql-master:
    image: mirror.gcr.io/library/mysql:8.0
    container_name: nexusmart-mysql-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: nexusmart
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    networks:
      - nexusmart-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 为主库创建复制账号
  mysql-master-init:
    image: mirror.gcr.io/library/mysql:8.0
    container_name: nexusmart-mysql-master-init
    depends_on:
      mysql-master:
        condition: service_healthy
    restart: "no"
    networks:
      - nexusmart-net
    command: >
      sh -c "
      until mysql -h mysql-master -uroot -p123456 -e 'SELECT 1' >/dev/null 2>&1; do
        echo 'waiting mysql-master...';
        sleep 2;
      done;
      mysql -h mysql-master -uroot -p123456 -e \"
        CREATE USER IF NOT EXISTS 'repl'@'%' IDENTIFIED WITH mysql_native_password BY 'repl123';
        GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'repl'@'%';
        FLUSH PRIVILEGES;
      \";
      echo 'mysql-master replication user ready.';
      "

  # ==================== MySQL Slave (Read Replica) ====================
  mysql-slave:
    image: mirror.gcr.io/library/mysql:8.0
    container_name: nexusmart-mysql-slave
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - mysql_slave_data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=2
      --relay-log=relay-bin
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --skip-replica-start=1
    networks:
      - nexusmart-net
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-master-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 自动在从库执行 CHANGE REPLICATION SOURCE TO + START REPLICA
  mysql-slave-init:
    image: mirror.gcr.io/library/mysql:8.0
    container_name: nexusmart-mysql-slave-init
    depends_on:
      mysql-slave:
        condition: service_healthy
      mysql-master-init:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - nexusmart-net
    command: >
      sh -c "
      until mysql -h mysql-slave -uroot -p123456 -e 'SELECT 1' >/dev/null 2>&1; do
        echo 'waiting mysql-slave...';
        sleep 2;
      done;
      mysql -h mysql-slave -uroot -p123456 -e \"
        STOP REPLICA;
        RESET REPLICA ALL;
        CHANGE REPLICATION SOURCE TO
          SOURCE_HOST='mysql-master',
          SOURCE_PORT=3306,
          SOURCE_USER='repl',
          SOURCE_PASSWORD='repl123',
          SOURCE_AUTO_POSITION=1,
          GET_SOURCE_PUBLIC_KEY=1;
        START REPLICA;
        SET GLOBAL read_only=ON;
        SET GLOBAL super_read_only=ON;
      \";
      echo 'mysql-slave replication started.';
      "

  # ==================== Redis ====================
  redis:
    image: mirror.gcr.io/library/redis:7-alpine
    container_name: nexusmart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - nexusmart-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Kafka (KRaft) ====================
  kafka:
    image: quay.io/strimzi/kafka:latest-kafka-3.7.0
    container_name: nexusmart-kafka
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9092:9092"
    command: >
      /bin/bash -ec "
      mkdir -p /var/lib/kafka/data;
      /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t MkU3OEVBNTcwNTJENDM2Qk -c /etc/kafka/kraft/server.properties;
      exec /opt/kafka/bin/kafka-server-start.sh /etc/kafka/kraft/server.properties;
      "
    volumes:
      - kafka_data:/var/lib/kafka/data
      - ./docker/kafka/server.properties:/etc/kafka/kraft/server.properties:ro
    networks:
      - nexusmart-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ==================== Elasticsearch (单节点,商品搜索) ====================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: nexusmart-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: Asia/Shanghai
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - nexusmart-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ==================== Nacos ====================
  nacos:
    image: docker.m.daocloud.io/nacos/nacos-server:v2.4.0
    container_name: nexusmart-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - nexusmart-net
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O /dev/null http://localhost:8848/nacos/index.html"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ==================== Spring Boot App ====================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusmart-app
    restart: unless-stopped
    environment:
      DB_HOST: mysql-master
      DB_MASTER_HOST: mysql-master
      DB_MASTER_PORT: 3306
      DB_SLAVE_HOST: mysql-slave
      DB_SLAVE_PORT: 3306
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_CONSUMER_GROUP: nexusmart-seckill-order-group
      ES_URIS: http://elasticsearch:9200
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ""
      NACOS_GROUP: DEFAULT_GROUP
      NACOS_SERVICE_NAME: nexusmart-seckill
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8081:8081"
    networks:
      - nexusmart-net
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-slave:
        condition: service_healthy
      mysql-slave-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      nacos:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # ==================== Spring Cloud Gateway ====================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: nexusmart-gateway
    restart: unless-stopped
    environment:
      NACOS_SERVER_ADDR: nacos:8848
      NACOS_NAMESPACE: ""
      NACOS_GROUP: DEFAULT_GROUP
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_OPTS: "-Xms128m -Xmx256m"
    ports:
      - "8080:8080"
    networks:
      - nexusmart-net
    depends_on:
      nacos:
        condition: service_healthy
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==================== Nginx ====================
  nginx:
    image: mirror.gcr.io/library/nginx:1.27-alpine
    container_name: nexusmart-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/main/resources/static:/usr/share/nginx/html:ro
    networks:
      - nexusmart-net
    depends_on:
      gateway:
        condition: service_healthy

networks:
  nexusmart-net:
    driver: bridge

volumes:
  mysql_master_data:
  mysql_slave_data:
  redis_data:
  kafka_data:
  es_data:
